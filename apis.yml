aid: brownie
name: IncidentFox (Brownie)
description: >-
  IncidentFox (the company was surfaced in the API Evangelist network under its
  Y Combinator portfolio codename "Brownie") is an open-source, AI-powered SRE
  platform that automates production incident investigation and response. Its
  multi-agent system triages alerts, queries logs, metrics, traces and
  deployment history across 300+ integrations (Kubernetes, AWS, Datadog,
  Grafana, Prometheus, Sentry, Coralogix, and more), correlates signals, finds
  root causes, and proposes remediation - operating primarily from Slack,
  Microsoft Teams, or Google Chat with human approval gates on all write
  actions. IncidentFox exposes a REST API (base https://api.incidentfox.ai/api/v1)
  for triggering investigations, polling status, and managing hierarchical team
  configuration, authenticated with team/admin bearer tokens or OIDC/SSO. It
  ships as Apache-2.0 open source (with a Business Source License security
  layer) or as managed SaaS with self-hosted and on-premises options.
